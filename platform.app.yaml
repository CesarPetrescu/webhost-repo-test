version: 1
frontend:
  path: probe-frontend
  buildMode: node-static
backend:
  path: probe-backend
  dockerfile: Dockerfile
  port: 8080
  healthPath: /healthz
database:
  postgres:
    tier: shared
    migrations:
      command: echo "PROBE-MIGRATE $(/usr/local/bin/probe.sh migration)"
routing:
  apiPrefix: /api
